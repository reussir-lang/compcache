name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "agentic-plan/**"]
  pull_request:
    paths-ignore: ["**/*.md", "agentic-plan/**"]
  workflow_dispatch:
    inputs:
      stress:
        description: Run the ten-second native multiprocess stress test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup install
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests without the external Nickel CLI
        run: cargo test --locked --lib -- --skip builder::tests::application_defaults_config_loading
      - name: Key compatibility tests
        run: cargo test --locked --test key --test serde_key
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Storage and process recovery tests
        run: cargo test --locked --test store --test maintenance --test schema --test process --test platform
      - name: Native multiprocess stress
        if: github.event_name == 'workflow_dispatch' && inputs.stress
        env:
          COMPCACHE_STRESS_SECONDS: "10"
        run: cargo test --locked --test stress
