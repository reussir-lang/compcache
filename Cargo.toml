[package]
name = "compcache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Synchronous local compiler cache with SQLite metadata and leased runtime directories"

[dependencies]
blake3 = "1.8"
dirs = "6"
fs4 = { version = "0.13", features = ["sync"] }
libc = "0.2"
parking_lot = "0.12"
quick_cache = { version = "0.6", default-features = false, features = ["parking_lot", "stats"] }
rapidhash = "4.5"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_LibraryLoader"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "cache"
harness = false
